# Configuration OpenEvolve pour l'évolution du config.js de candidate.
#
# Budget d'une itération : génération LLM (~1-2 min) + stage 1 (6
# parties ~1 min) + stage 2 si franchi (24 parties ~2-4 min), soit
# ~100 itérations par nuit de 8 h.

max_iterations: 100
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42
language: "javascript"
file_suffix: ".js"

# config.js fait ~11,4 Ko ; laisser de la marge sans autoriser
# l'obésité (le fichier entier passe dans le prompt).
max_code_length: 24000
diff_based_evolution: true

llm:
  provider: "claude_code"
  models:
    - name: "sonnet"
      weight: 1.0
      timeout: 600
      # DOIT être par-modèle : la clé ne fait pas partie du
      # shared_config propagé par LLMConfig.__post_init__, et un None
      # devient un `--max-budget-usd None` qui fait échouer chaque
      # appel du CLI (revue 2026-09-02).
      max_budget_usd: 2.0
      # 1 seul retry : avec parallel_evaluations=1, un appel qui
      # s'éternise (4 × 630 s au pire par défaut) dépasserait le
      # timeout du worker unique et bloquerait la file sans bruit.
      retries: 1
  temperature: 0.8

prompt:
  system_message: |
    You are evolving `config.js` of a Petra-derived AI bot for the RTS
    game 0 A.D. (version 0.28). This file defines the bot's strategy
    parameters and is loaded as an ES module by the game engine's
    SpiderMonkey runtime.

    Hard constraints — breaking any of these makes the bot lose every
    game (score 0):
    - Keep the two `import` lines and the `export function Config(...)`
      signature exactly as they are (the import paths must stay
      `simulation/ai/common-api/utils.js` and
      `simulation/ai/candidate/difficultyLevel.js`).
    - The Config prototype methods at the end of the file must keep
      their names and signatures.
    - Valid SpiderMonkey/ES2020 JavaScript only. No Node APIs, no
      network, no filesystem.

    What you can change: every strategy parameter (economy targets,
    military timings, phase advancement, tower/fortress cadence, attack
    plan sizes, priorities...), and you may add new derived parameters
    or restructure values, as long as existing keys consumed elsewhere
    keep existing (other Petra modules read Config fields — removing a
    field crashes the bot, which scores 0).

    The bot is evaluated by playing full games, both positions, on
    mainland 128 with identical civilizations, against a pool of
    opponents: the stock Petra AI at easy, medium and hard difficulty,
    plus possibly hall-of-fame bots (strong earlier versions of this
    same evolving bot). Metrics: wr_easy, wr_medium, wr_hard (Petra
    anchors), wr_hof if hall-of-fame opponents are present,
    combined_score (mean of the per-opponent winrates over the WHOLE
    pool — its scale shifts when the pool grows, compare only within
    one run), no_result counts stalled/crashed games as losses,
    mean_game_min is the mean length of decisive games. Improve the
    score by making the strategy stronger and faster — e.g. tighter
    early economy, better timed aggression, smarter phase timings —
    not by stalling games.

    The population is also mapped on two behavioral dimensions measured
    from replays: aggression (how early the bot draws first blood) and
    boom (population reached by minute 10). Distinct playstyles —
    rushes, turtles, booms, timing attacks — occupy distinct niches and
    are preserved even at equal score, so exploring a genuinely
    different strategy is valuable, not just tuning the current one.

    MANDATORY: every mutation is an experiment, not a tweak. The FIRST
    TWO LINES of the file are comment lines, placed ABOVE the two
    import lines (which then follow, unchanged); rewrite these two
    comments at every mutation (replace the previous ones):
      // HYPOTHESIS: <one sentence: the strategic idea being tested
         and why it should work against this pool>
      // PREDICTION: <comma-separated directional claims among:
         aggression, boom, military, map_control, wr_easy, wr_medium,
         wr_hard, wr_hof, combined_score — e.g. "aggression=+, boom=-,
         wr_hard=+">
    Your prediction is checked against the measured metrics after the
    games are played; a mutation whose prediction is refuted or whose
    effect is null is treated as noise. Vague or missing headers make
    the experiment worthless. Parameter changes without a strategic
    hypothesis behind them are noise — do not submit them.

database:
  population_size: 60
  archive_size: 25
  num_islands: 3
  # MAP-Elites sur le COMPORTEMENT, pas sur le code : aggression
  # (précocité du premier sang infligé) et boom (pop à 10 min), extraits
  # des replays par le harnais (oadlab.descriptors) et rendus dans les
  # métriques de l'évaluateur. La fitness reste combined_score ; ces
  # dimensions ne font que placer le programme dans la grille, pour que
  # la population couvre des styles au lieu de converger sur un seul
  # (plateau à 0.75 dès l'itération 9 la nuit du 2026-09-02).
  feature_dimensions: ["aggression", "boom"]
  feature_bins: 8
  elite_selection_ratio: 0.15
  exploration_ratio: 0.25
  exploitation_ratio: 0.6
  migration_interval: 20
  migration_rate: 0.1

evaluator:
  timeout: 1800
  max_retries: 1
  cascade_evaluation: true
  # stage 1 (6 parties) doit dépasser ce combined_score pour accéder
  # au stage 2 ; le baseline stage-1 tourne autour de 0.5.
  cascade_thresholds: [0.34]
  parallel_evaluations: 1
  enable_artifacts: true
